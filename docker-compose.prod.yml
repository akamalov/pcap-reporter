version: '3.8'

services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: pcap-reporter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./static:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pcap-network
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    labels:
      - "com.docker.compose.service=nginx"
      - "com.docker.compose.project=pcap-reporter"

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pcap-reporter-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/.env.prod:/app/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter_prod
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_PATH=/app/uploads
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://your-domain.com
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - redis
    networks:
      - pcap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=backend"
      - "com.docker.compose.project=pcap-reporter"

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: pcap-reporter-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://your-domain.com/api
      - NEXT_PUBLIC_WS_URL=wss://your-domain.com/ws
    networks:
      - pcap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=frontend"
      - "com.docker.compose.project=pcap-reporter"

  # Celery worker for background processing
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pcap-reporter-celery
    restart: unless-stopped
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/.env.prod:/app/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter_prod
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_PATH=/app/uploads
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
      - redis
    networks:
      - pcap-network
    healthcheck:
      test: ["CMD", "celery", "-A", "core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=celery-worker"
      - "com.docker.compose.project=pcap-reporter"

  # Celery beat scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pcap-reporter-celery-beat
    restart: unless-stopped
    command: celery -A core.celery_app beat --loglevel=info
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/.env.prod:/app/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter_prod
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
      - redis
    networks:
      - pcap-network
    labels:
      - "com.docker.compose.service=celery-beat"
      - "com.docker.compose.project=pcap-reporter"

  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: pcap-reporter-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
      - ./mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=pcap_reporter_prod
    command: mongod --config /etc/mongod.conf
    networks:
      - pcap-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=mongodb"
      - "com.docker.compose.project=pcap-reporter"

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: pcap-reporter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/logs:/var/log/redis
    command: redis-server /etc/redis/redis.conf
    networks:
      - pcap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=redis"
      - "com.docker.compose.project=pcap-reporter"

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: pcap-reporter-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pcap-network
    labels:
      - "com.docker.compose.service=prometheus"
      - "com.docker.compose.project=pcap-reporter"

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: pcap-reporter-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - pcap-network
    depends_on:
      - prometheus
    labels:
      - "com.docker.compose.service=grafana"
      - "com.docker.compose.project=pcap-reporter"

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: pcap-reporter-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pcap-network
    labels:
      - "com.docker.compose.service=node-exporter"
      - "com.docker.compose.project=pcap-reporter"

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: pcap-reporter-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pcap-network
    labels:
      - "com.docker.compose.service=loki"
      - "com.docker.compose.project=pcap-reporter"

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: pcap-reporter-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/log:/var/log:ro
      - ./backend/logs:/var/log/backend:ro
      - ./nginx/logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - pcap-network
    depends_on:
      - loki
    labels:
      - "com.docker.compose.service=promtail"
      - "com.docker.compose.project=pcap-reporter"

networks:
  pcap-network:
    driver: bridge
    name: pcap-reporter-network

volumes:
  mongodb_data:
    name: pcap-reporter-mongodb-data
  redis_data:
    name: pcap-reporter-redis-data
  prometheus_data:
    name: pcap-reporter-prometheus-data
  grafana_data:
    name: pcap-reporter-grafana-data
  loki_data:
    name: pcap-reporter-loki-data 