version: '3.8'

services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: pcap-reporter-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pcap-reporter-network

  # FastAPI backend service
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pcap-reporter-api
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DEBUG=false
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - pcap-reporter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery worker for analysis tasks
  celery-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pcap-reporter-celery-worker
    command: celery -A main.celery worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - pcap-reporter-network

  # Celery beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pcap-reporter-celery-beat
    command: celery -A main.celery beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - pcap-reporter-network

  # Flower for monitoring Celery tasks
  flower:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pcap-reporter-flower
    command: celery -A main.celery flower --port=5555
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mongodb://mongodb:27017/pcap_reporter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "5555:5555"
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - pcap-reporter-network

  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: pcap-reporter-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=pcap_reporter
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    restart: unless-stopped
    networks:
      - pcap-reporter-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/pcap_reporter --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and message broker
  redis:
    image: redis:7-alpine
    container_name: pcap-reporter-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - pcap-reporter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend development server (for development only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcap-reporter-frontend
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pcap-reporter-network
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  pcap-reporter-network:
    driver: bridge 